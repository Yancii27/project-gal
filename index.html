          <div style="font-size:${activeDeck.flipped ? '15px' : '18px'}; font-weight:${activeDeck.flipped ? '600' : '800'}; white-space:pre-line;">${activeDeck.flipped ? card.back : card.front}</div>
          <div class="fc-hint">${activeDeck.flipped ? "Showing Answer · Tap to flip back" : "Tap card to reveal answer"}</div>
        </div>
        ${activeDeck.flipped ? `<div class="grid-2 mt-12"><button class="btn btn-warn" onclick="rateCard(false)">↻ Need Review</button><button class="btn btn-success" onclick="rateCard(true)">✓ Got It</button></div>`
                             : `<div class="text-muted mt-12" style="text-align:center;">${activeDeck.queue.length} card(s) left in queue</div>`}`;
    }
    function flipCard() { activeDeck.flipped = !activeDeck.flipped; renderFlashcard(); }
    function shuffleDeck() { activeDeck.queue.sort(() => Math.random() - 0.5); activeDeck.flipped = false; renderFlashcard(); }
    function rateCard(gotIt) { const c = activeDeck.queue.shift(); if (gotIt) activeDeck.mastered++; else activeDeck.queue.push(c); activeDeck.flipped = false; renderFlashcard(); }

    // --- PROGRESS DASHBOARD (WITH SCORE TREND CHART) ---
    function setTrendFilter(code) { trendFilter = code; renderProgress(); }

    function renderProgress() {
      const readiness = getReadinessScore();
      const sorted = getAllSubjects().map(s => ({ ...s, acc: getSubjectAccuracy(s.code) })).sort((a, b) => (a.acc === null ? 999 : a.acc) - (b.acc === null ? 999 : b.acc));
      const trendChips = ["Overall", "FAR", "AFAR", "MAS", "TAX", "RFBT", "AUD"].map(c =>
        `<button class="chip-btn ${trendFilter === c ? 'active' : ''}" onclick="setTrendFilter('${c}')">${c}</button>`).join("");

      let priorityHtml = sorted.map(s => `
        <div class="card card-clickable" onclick="navigate('subjectDetail', {code:'${s.code}'})">
          <div class="row-between">
            <div style="min-width:0;">
              <div style="font-weight:700; font-size:14px;">${s.code} · ${s.name}</div>
              ${s.acc !== null && s.acc < 65 ? `<div style="color:var(--red-text); font-size:11px; font-weight:700;">⚠ Below 65% minimum threshold</div>` : ""}
            </div>
            ${getStatusBadge(s.acc)}
          </div>
        </div>`).join("");

      document.getElementById("app").innerHTML = `
        <div class="row-between">
          <div><div class="section-label">Performance</div><div class="page-title" style="margin-bottom:8px;">CPALE Dashboard</div></div>
          <button class="btn btn-outline btn-sm" onclick="navigate('manage')">⚙️ Manage</button>
        </div>

        <div class="card" style="text-align:center;">
          <div class="section-label">CPALE Readiness Score</div>
          <div style="font-size:40px; font-weight:800; color:var(--primary); margin:4px 0;">${readiness === null ? "--" : readiness + "%"}</div>
          <div class="mb-8">${getStatusBadge(readiness)}</div>
          <div class="text-muted">Target: 75% overall · Min. 65% per subject</div>
        </div>

        <div class="card">
          <div class="section-label">Score Trend (Last 10 Attempts)</div>
          <div class="chip-strip mt-8">${trendChips}</div>
          ${buildScoreTrendSvg(trendFilter)}
        </div>

        <div class="card" style="border-color: ${state.mistakeBank.length > 0 ? '#FCA5A5' : 'var(--border)'};">
          <div class="row-between">
            <div>
              <div style="font-weight:800; font-size:15px;">🎯 Weak-Area Mistake Bank</div>
              <div class="text-muted">${state.mistakeBank.length > 0 ? state.mistakeBank.length + " missed question(s) waiting for mastery" : "All clear! No missed questions right now."}</div>
            </div>
            ${state.mistakeBank.length > 0 ? `<button class="btn btn-danger btn-sm" onclick="startMistakeDrill()">Drill Now</button>` : `<span class="badge badge-pass">Clean</span>`}
          </div>
        </div>

        <div class="section-label mt-12">Priority Subjects (Lowest First)</div>
        ${priorityHtml}
        <button class="btn btn-danger mt-12" onclick="resetAllProgress()">Reset Study Progress</button>`;
    }

    function resetAllProgress() {
      if (confirm("Reset XP, streaks, quiz scores, trend history, and Mistake Bank? (Your imported modules, theme, & handout notes will be kept.)")) {
        const keep = { theme: state.theme, dailyXpGoal: state.dailyXpGoal, customData: state.customData, handoutAnnotations: state.handoutAnnotations, customHighlightColors: state.customHighlightColors };
        state = { ...getDefaultState(), ...keep };
        saveState(); renderProgress();
      }
    }

    // ==========================================
    // 11. MANAGE CONTENT (FILE UPLOAD/DOWNLOAD + PASTE)
    // ==========================================
    const SAMPLES = {
      questions: `subject_code,module_id,module_title,tier,question,choice_a,choice_b,choice_c,choice_d,correct_answer,explanation\nFAR,far-m2,Cash & Cash Equivalents,Basic,"Which of the following is considered a cash equivalent under PAS 7?","3-month Treasury bill purchased 2 months before maturity","Equity shares held for trading","6-month time deposit","Postdated customer check",A,"Cash equivalents are short-term, highly liquid investments with original maturity of 3 months or less from date of acquisition."`,
      handouts: `subject_code,module_id,module_title,section_title,content,callout_type,callout_text\nFAR,far-m2,Cash & Cash Equivalents,"1. Cash Equivalents (PAS 7)","Short-term, highly liquid investments readily convertible to known amounts of cash with insignificant risk of changes in value.",note,"PAS 7 Rule: Must be acquired 3 months or less BEFORE maturity date."`,
      flashcards: `subject_code,module_id,module_title,front,back,tag\nFAR,far-m2,Cash & Cash Equivalents,"How are bank overdrafts presented under PFRS?","Generally as a Current Liability, unless repayable on demand and an integral part of cash management.",PAS 7`
    };

    function downloadFile(filename, content, mimeType) {
      try {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a); URL.revokeObjectURL(url);
      } catch (e) {
        alert("Direct file download is restricted in this preview. Use Copy/Paste instead!");
      }
    }

    function handleCsvFileUpload(evt) {
      const file = evt.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        document.getElementById("csvInput").value = e.target.result;
        previewCsvImport();
      };
      reader.readAsText(file);
    }

    function handleBackupFileUpload(evt) {
      const file = evt.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => applyRestoredJson(e.target.result);
      reader.readAsText(file);
    }

    function getCustomImportedSummary() {
      const list = [], seen = new Set(), allSubjs = getAllSubjects();
      Object.keys(state.customData.modules || {}).forEach(subjCode => (state.customData.modules[subjCode] || []).forEach(m => {
        if (!seen.has(m.id)) { seen.add(m.id); list.push({ subjCode, modId: m.id, title: m.title }); }
      }));
      new Set([...Object.keys(state.customData.questions || {}), ...Object.keys(state.customData.handouts || {}), ...Object.keys(state.customData.flashcards || {})]).forEach(modId => {
        if (!seen.has(modId)) {
          let foundSubj = "CUSTOM", foundTitle = modId;
          allSubjs.forEach(s => s.modules.forEach(m => { if (m.id === modId) { foundSubj = s.code; foundTitle = m.title; } }));
          seen.add(modId); list.push({ subjCode: foundSubj, modId, title: foundTitle });
        }
      });
      return list.map(item => {
        const cq = state.customData.questions[item.modId];
        return {
          ...item,
          qCount: cq ? (cq.Basic?.length || 0) + (cq.Medium?.length || 0) + (cq.Hard?.length || 0) : 0,
          hCount: state.customData.handouts[item.modId]?.length || 0,
          fCount: state.customData.flashcards[item.modId]?.length || 0
        };
      }).filter(item => item.qCount + item.hCount + item.fCount > 0 || (state.customData.modules[item.subjCode] || []).some(m => m.id === item.modId));
    }

    function deleteCustomModule(subjCode, modId, title) {
      if (!confirm(`Delete all custom imported content for "${title}" (${modId})?`)) return;
      delete state.customData.questions[modId]; delete state.customData.handouts[modId]; delete state.customData.flashcards[modId];
      if (state.customData.modules[subjCode]) state.customData.modules[subjCode] = state.customData.modules[subjCode].filter(m => m.id !== modId);
      saveState(); renderManageContent();
    }

    function renderManageContent() {
      importPreviewData = null;
      const customList = getCustomImportedSummary();
      const customHtml = customList.length === 0 ? `<div class="text-muted">No custom imported modules yet.</div>`
        : customList.map(c => `
            <div class="row-between" style="padding:10px 0; border-top:1px dashed var(--border);">
              <div style="min-width:0;"><div style="font-weight:700; font-size:13.5px;">${c.subjCode} · ${escapeHtml(c.title)}</div><div class="text-muted" style="font-size:12px;">${c.qCount} Q · ${c.hCount} Handout · ${c.fCount} Card(s)</div></div>
              <button class="btn btn-danger btn-sm" onclick="deleteCustomModule('${c.subjCode}','${c.modId}','${escapeHtml(c.title)}')">🗑 Delete</button>
            </div>`).join("");

      document.getElementById("app").innerHTML = `
        <button class="back-link" onclick="navigate('progress')">‹ Back to Dashboard</button>
        <div class="section-label">Content Pipeline</div>
        <div class="page-title">Manage Content</div>
        <div class="tab-bar">
          <button class="tab-btn ${importTab === 'questions' ? 'active' : ''}" onclick="switchImportTab('questions')">Questions</button>
          <button class="tab-btn ${importTab === 'handouts' ? 'active' : ''}" onclick="switchImportTab('handouts')">Handouts</button>
          <button class="tab-btn ${importTab === 'flashcards' ? 'active' : ''}" onclick="switchImportTab('flashcards')">Flashcards</button>
        </div>

        <div class="card">
          <div style="font-weight:800; font-size:14px; margin-bottom:8px;">Import ${importTab.toUpperCase()} (.CSV)</div>
          <div class="grid-2 mb-8">
            <label class="btn btn-outline btn-sm file-btn" style="width:100%;">📂 Upload .CSV<input type="file" onchange="handleCsvFileUpload(event)" /></label>
            <button class="btn btn-outline btn-sm" style="width:100%;" onclick="downloadFile('gal_${importTab}_template.csv', SAMPLES[importTab], 'text/csv')">⬇ Sample .CSV</button>
          </div>
          <div class="row-between mb-8">
            <span class="text-muted" style="font-size:12px;">Or paste CSV rows below:</span>
            <button class="btn btn-outline btn-sm" style="padding:4px 9px; font-size:11px;" onclick="pasteSampleCsv()">Paste Sample</button>
          </div>
          <textarea id="csvInput" class="code-input" placeholder="Paste CSV rows here (including header row)..."></textarea>
          <button class="btn btn-primary mt-8" onclick="previewCsvImport()">Check & Preview</button>
          <div id="importPreviewBox" class="mt-12"></div>
        </div>

        <div class="card">
          <div style="font-weight:800; font-size:15px; margin-bottom:6px;">Custom Imported Modules (${customList.length})</div>
          ${customHtml}
        </div>

        <div class="card">
          <div style="font-weight:800; font-size:15px; margin-bottom:6px;">Backup & Restore (JSON)</div>
          <div class="text-muted mb-8">Saves all imported modules, highlights, notes, trend history, and XP.</div>
          <div class="grid-2 mb-8">
            <button class="btn btn-outline btn-sm" style="width:100%;" onclick="downloadFile('project_gal_backup.json', JSON.stringify(state, null, 2), 'application/json')">⬇ Save .JSON</button>
            <label class="btn btn-outline btn-sm file-btn" style="width:100%;">📂 Load .JSON<input type="file" onchange="handleBackupFileUpload(event)" /></label>
          </div>
          <div class="grid-2">
            <button class="btn btn-outline btn-sm" style="width:100%;" onclick="exportBackup()">📋 Copy JSON</button>
            <button class="btn btn-outline btn-sm" style="width:100%;" onclick="restoreBackup()">📥 Paste JSON</button>
          </div>
        </div>`;
    }

    function switchImportTab(tab) { importTab = tab; renderManageContent(); }
    function pasteSampleCsv() { document.getElementById("csvInput").value = SAMPLES[importTab]; }

    function parseCSV(text) {
      const rows = []; let row = [], val = "", inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i], next = text[i + 1];
        if (inQuotes) { if (c === '"' && next === '"') { val += '"'; i++; } else if (c === '"') inQuotes = false; else val += c; }
        else {
          if (c === '"') inQuotes = true;
          else if (c === ',') { row.push(val.trim()); val = ""; }
          else if (c === '\n' || c === '\r') { if (c === '\r' && next === '\n') i++; row.push(val.trim()); if (row.some(cell => cell !== "")) rows.push(row); row = []; val = ""; }
          else val += c;
        }
      }
      if (val !== "" || row.length > 0) { row.push(val.trim()); if (row.some(cell => cell !== "")) rows.push(row); }
      return rows;
    }

    function previewCsvImport() {
      const raw = document.getElementById("csvInput").value.trim(), box = document.getElementById("importPreviewBox");
      if (!raw) { box.innerHTML = `<div class="badge badge-risk">Please upload or paste CSV data first.</div>`; return; }
      const rows = parseCSV(raw);
      if (rows.length < 2) { box.innerHTML = `<div class="badge badge-risk">Need a header row and at least 1 data row.</div>`; return; }
      const valid = [], errors = [], validSubjs = ["FAR", "AFAR", "MAS", "TAX", "RFBT", "AUD"];

      for (let i = 1; i < rows.length; i++) {
        const r = rows[i], subj = (r[0] || "").toUpperCase();
        if (!validSubjs.includes(subj)) { errors.push(`Row ${i + 1}: Invalid subject '${r[0]}'`); continue; }
        if (importTab === "questions") {
          const [_, modId, modTitle, tier, q, a, b, c, d, ans, exp] = r;
          const ansIdx = ["A", "B", "C", "D"].indexOf((ans || "").toUpperCase());
          if (!modId || !q || ansIdx === -1 || !["Basic", "Medium", "Hard"].includes(tier)) { errors.push(`Row ${i + 1}: Check tier or correct_answer (A-D).`); continue; }
          valid.push({ subj, modId, modTitle: modTitle || modId, tier, item: { id: `${modId}-${Date.now()}-${i}`, q, choices: [a, b, c, d], ans: ansIdx, exp: exp || "" } });
        } else if (importTab === "handouts") {
          const [_, modId, modTitle, secTitle, body, calloutType, calloutText] = r;
          if (!modId || !secTitle || !body) { errors.push(`Row ${i + 1}: Missing module_id, section_title, or content.`); continue; }
          valid.push({ subj, modId, modTitle: modTitle || modId, item: { title: secTitle, body, calloutType: calloutType || "none", calloutText: calloutText || "" } });
        } else if (importTab === "flashcards") {
          const [_, modId, modTitle, front, back, tag] = r;
          if (!modId || !front || !back) { errors.push(`Row ${i + 1}: Missing module_id, front, or back.`); continue; }
          valid.push({ subj, modId, modTitle: modTitle || modId, item: { front, back, tag: tag || "" } });
        }
      }
      importPreviewData = valid;
      box.innerHTML = `
        <div class="callout" style="background:${valid.length ? 'var(--green-bg)' : 'var(--red-bg)'}; color:${valid.length ? 'var(--green-text)' : 'var(--red-text)'};">
          <strong>Detected ${valid.length} valid ${importTab}</strong> · ${errors.length} error(s).
          ${errors.length ? `<div style="margin-top:6px; font-size:12px;">${errors.join("<br>")}</div>` : ""}
        </div>
        ${valid.length > 0 ? `<button class="btn btn-success" onclick="confirmCsvImport()">✓ Confirm & Save ${valid.length} Item(s)</button>` : ""}`;
    }

    function confirmCsvImport() {
      if (!importPreviewData || importPreviewData.length === 0) return;
      importPreviewData.forEach(entry => {
        const { subj, modId, modTitle, tier, item } = entry;
        if (!state.customData.modules[subj]) state.customData.modules[subj] = [];
        if (!state.customData.modules[subj].some(m => m.id === modId)) state.customData.modules[subj].push({ id: modId, title: modTitle, subtitle: "Imported module", isCustom: true });
        if (importTab === "questions") { if (!state.customData.questions[modId]) state.customData.questions[modId] = { Basic: [], Medium: [], Hard: [] }; state.customData.questions[modId][tier].push(item); }
        else if (importTab === "handouts") { if (!state.customData.handouts[modId]) state.customData.handouts[modId] = []; state.customData.handouts[modId].push(item); }
        else if (importTab === "flashcards") { if (!state.customData.flashcards[modId]) state.customData.flashcards[modId] = []; state.customData.flashcards[modId].push(item); }
      });
      saveState(); alert(`Successfully imported ${importPreviewData.length} ${importTab}!`); renderManageContent();
    }

    function exportBackup() {
      const json = JSON.stringify(state);
      if (navigator.clipboard) navigator.clipboard.writeText(json).then(() => alert("Full Backup JSON copied to clipboard!"));
      else prompt("Copy your Full Backup JSON below:", json);
    }
    function applyRestoredJson(raw) {
      try {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed.xp === "number") { state = { ...getDefaultState(), ...parsed }; applyTheme(); saveState(); alert("Backup restored successfully!"); navigate("progress"); }
        else alert("Invalid backup format.");
      } catch (e) { alert("Could not read JSON."); }
    }
    function restoreBackup() { const raw = prompt("Paste your saved Backup JSON here:"); if (raw) applyRestoredJson(raw); }

    // Initialize
    applyTheme();
    updateHeader();
    renderHome();

    // Register Offline Service Worker (activates once hosted on HTTPS)
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
